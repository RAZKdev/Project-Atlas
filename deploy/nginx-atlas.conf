# Konfigurasi Nginx untuk Project Atlas di subpath /atlas/
# Upload isi dist/ ke /var/www/atlas di VPS, lalu include blok ini
# di dalam server block Anda (mis. /etc/nginx/conf.d/atlas.conf).

# Struktur: /atlas/<file> dipetakan ke /var/www/atlas/<file>
location /atlas/ {
    root /var/www;
    index index.html;
    try_files $uri $uri/ /atlas/index.html;

    # Aset ber-hash dari Vite (JS/CSS/font/gambar di /atlas/assets/): cache 1 tahun immutable
    location ~* ^/atlas/assets/.*\.(js|css|woff2|png|jpe?g|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service Worker & manifest: no-cache agar update PWA langsung terdeteksi
    location = /atlas/sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }
    location = /atlas/manifest.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }
    location = /atlas/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }
}
